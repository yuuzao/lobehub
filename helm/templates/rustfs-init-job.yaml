{{- if .Values.rustfs.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lobehub.fullname" . }}-rustfs-init
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs-init
  annotations:
    # 确保在 helm install/upgrade 后执行
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "lobehub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs-init
    spec:
      {{- include "lobehub.imagePullSecrets" . | nindent 6 }}
      restartPolicy: OnFailure
      initContainers:
        # 等待 RustFS 就绪
        - name: wait-for-rustfs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "等待 RustFS 就绪..."
              until wget -qO- http://{{ include "lobehub.rustfs.host" . }}:9000/health >/dev/null 2>&1; do
                echo "RustFS 尚未就绪，等待中..."
                sleep 3
              done
              echo "RustFS 已就绪！"
      containers:
        - name: mc
          image: "{{ .Values.rustfs.init.image.repository }}:{{ .Values.rustfs.init.image.tag }}"
          imagePullPolicy: {{ .Values.rustfs.init.image.pullPolicy | default .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eux
              echo "S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}"
              mc --version
              mc alias set rustfs "http://{{ include "lobehub.rustfs.host" . }}:9000" "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}"
              mc ls rustfs || true
              mc mb "rustfs/{{ .Values.rustfs.bucket }}" --ignore-existing
              mc admin info rustfs || true
              mc anonymous set-json "/bucket.config.json" "rustfs/{{ .Values.rustfs.bucket }}"
              echo "RustFS 初始化完成！"
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-rustfs
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-rustfs
                  key: RUSTFS_SECRET_KEY
          volumeMounts:
            - name: bucket-config
              mountPath: /bucket.config.json
              subPath: bucket.config.json
              readOnly: true
      volumes:
        - name: bucket-config
          configMap:
            name: {{ include "lobehub.fullname" . }}-bucket-config
{{- end }}
