apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lobehub.fullname" . }}
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: lobe
spec:
  replicas: {{ .Values.lobe.replicaCount }}
  selector:
    matchLabels:
      {{- include "lobehub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: lobe
  template:
    metadata:
      labels:
        {{- include "lobehub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: lobe
    spec:
      {{- include "lobehub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: lobe
          image: "{{ .Values.lobe.image.repository }}:{{ .Values.lobe.image.tag }}"
          imagePullPolicy: {{ .Values.lobe.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3210
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "lobehub.fullname" . }}-config
          env:
            - name: KEY_VAULTS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-secrets
                  key: KEY_VAULTS_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-secrets
                  key: AUTH_SECRET
            {{- if .Values.secrets.jwksKey }}
            - name: JWKS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-secrets
                  key: JWKS_KEY
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-postgresql
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ include "lobehub.redis.url" . | quote }}
            {{- end }}
            {{- if .Values.rustfs.enabled }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-rustfs
                  key: RUSTFS_ACCESS_KEY
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-rustfs
                  key: RUSTFS_ACCESS_KEY
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-rustfs
                  key: RUSTFS_SECRET_KEY
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.lobe.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.lobe.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lobe.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lobe.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lobehub.fullname" . }}
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: lobe
spec:
  type: {{ .Values.lobe.service.type }}
  ports:
    - port: {{ .Values.lobe.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lobehub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lobe
