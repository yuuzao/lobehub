{{- if .Values.rustfs.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lobehub.fullname" . }}-rustfs
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  serviceName: {{ include "lobehub.fullname" . }}-rustfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "lobehub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "lobehub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      {{- include "lobehub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: rustfs
          image: "{{ .Values.rustfs.image.repository }}:{{ .Values.rustfs.image.tag }}"
          imagePullPolicy: {{ .Values.rustfs.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          args:
            - "--access-key"
            - "$(RUSTFS_ACCESS_KEY)"
            - "--secret-key"
            - "$(RUSTFS_SECRET_KEY)"
            - "/data"
          env:
            - name: RUSTFS_CONSOLE_ENABLE
              value: {{ .Values.rustfs.consoleEnabled | quote }}
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-rustfs
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lobehub.fullname" . }}-rustfs
                  key: RUSTFS_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- with .Values.rustfs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.rustfs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rustfs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rustfs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.rustfs.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.rustfs.persistence.accessModes | nindent 10 }}
        {{- if .Values.rustfs.persistence.storageClass }}
        storageClassName: {{ .Values.rustfs.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.size | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lobehub.fullname" . }}-rustfs
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  type: {{ .Values.rustfs.service.type }}
  ports:
    - port: {{ .Values.rustfs.service.port }}
      targetPort: api
      protocol: TCP
      name: api
    - port: {{ .Values.rustfs.service.consolePort }}
      targetPort: console
      protocol: TCP
      name: console
  selector:
    {{- include "lobehub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
{{- end }}
