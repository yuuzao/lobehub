{{- if .Values.searxng.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lobehub.fullname" . }}-searxng
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lobehub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: searxng
  template:
    metadata:
      labels:
        {{- include "lobehub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: searxng
    spec:
      {{- include "lobehub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: searxng
          image: "{{ .Values.searxng.image.repository }}:{{ .Values.searxng.image.tag }}"
          imagePullPolicy: {{ .Values.searxng.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SEARXNG_SETTINGS_FILE
              value: /etc/searxng/settings.yml
          {{- if or .Values.searxng.customSettings .Values.searxng.useDefaultSettings }}
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.searxng.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.searxng.customSettings .Values.searxng.useDefaultSettings }}
      volumes:
        - name: settings
          configMap:
            name: {{ include "lobehub.fullname" . }}-searxng
      {{- end }}
      {{- with .Values.searxng.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.searxng.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.searxng.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lobehub.fullname" . }}-searxng
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  type: {{ .Values.searxng.service.type }}
  ports:
    - port: {{ .Values.searxng.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lobehub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
{{- end }}
