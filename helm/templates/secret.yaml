apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lobehub.fullname" . }}-secrets
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
type: Opaque
data:
  KEY_VAULTS_SECRET: {{ .Values.secrets.keyVaultsSecret | b64enc | quote }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | b64enc | quote }}
  {{- if .Values.secrets.jwksKey }}
  JWKS_KEY: {{ .Values.secrets.jwksKey | b64enc | quote }}
  {{- end }}
---
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lobehub.fullname" . }}-postgresql
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | b64enc | quote }}
  DATABASE_URL: {{ include "lobehub.postgresql.url" . | b64enc | quote }}
{{- end }}
---
{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lobehub.fullname" . }}-rustfs
  labels:
    {{- include "lobehub.labels" . | nindent 4 }}
type: Opaque
data:
  RUSTFS_ACCESS_KEY: {{ .Values.rustfs.accessKey | b64enc | quote }}
  RUSTFS_SECRET_KEY: {{ .Values.rustfs.secretKey | b64enc | quote }}
{{- end }}
