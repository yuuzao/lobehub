name: Build & Publish Custom Docker Image

permissions:
  contents: read
  packages: write

on:
  # 上游同步完成后自动触发构建
  workflow_run:
    workflows: ['Sync Upstream Fork']
    types: [completed]
    branches: [main, canary]
  # 手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空则使用分支名+SHA）'
        required: false
        default: ''
      branch:
        description: '构建分支'
        required: false
        default: 'canary'
        type: choice
        options:
          - canary
          - main

concurrency:
  group: ${{ github.ref }}-custom-docker
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/lobehub

jobs:
  build:
    # 仅在上游同步成功后构建，或手动触发时构建
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} Image
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch || 'canary' }}

      - name: Get metadata
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          # 如果手动指定了 tag 则使用，否则使用 分支名-SHA
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "custom_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "custom_tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.custom_tag }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.branch == 'main' }}
            type=raw,value=canary,enable=${{ steps.vars.outputs.branch == 'canary' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Manifests & Push Tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch || 'canary' }}

      - name: Get metadata
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "custom_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "custom_tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.custom_tag }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.branch == 'main' }}
            type=raw,value=canary,enable=${{ steps.vars.outputs.branch == 'canary' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $TAGS \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.vars.outputs.custom_tag }}

  helm-chart:
    name: Publish Helm Chart
    # 仅在上游同步成功后构建，或手动触发时构建（与 build job 同级并行）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch || 'canary' }}

      - name: Get metadata
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update Chart.yaml with build info
        run: |
          BRANCH="${{ steps.vars.outputs.branch }}"
          SHA="${{ steps.vars.outputs.sha_short }}"
          # 读取基础版本号
          BASE_VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          # 生成带 SHA 的版本号：0.1.0-canary.abc1234
          CHART_VERSION="${BASE_VERSION}-${BRANCH}.${SHA}"
          # 更新 Chart.yaml
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${BRANCH}-${SHA}\"/" helm/Chart.yaml
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          cat helm/Chart.yaml

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package Helm Chart
        run: |
          helm package helm/ --destination /tmp/helm-pkg

      - name: Push Helm Chart to GHCR
        run: |
          CHART_PKG=$(ls /tmp/helm-pkg/*.tgz)
          helm push "${CHART_PKG}" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
