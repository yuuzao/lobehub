name: Build & Publish Custom Docker Image

permissions:
  contents: read
  packages: write

on:
  # 仅手动触发，避免每次上游同步后自动构建/发布镜像和 Helm Chart
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空则使用分支名+SHA）'
        required: false
        default: ''
      branch:
        description: '构建分支'
        required: false
        default: 'canary'
        type: choice
        options:
          - canary
          - main

concurrency:
  group: ${{ github.ref }}-custom-docker
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/lobehub

jobs:
  build-and-push:
    name: Build & Push amd64 Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'canary' }}

      - name: Get metadata
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          # 如果手动指定了 tag 则使用，否则使用 分支名-SHA
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "custom_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "custom_tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi
          # 打印构建信息
          echo "::notice::Building from commit $(git rev-parse HEAD) on branch ${BRANCH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.custom_tag }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.branch == 'main' }}
            type=raw,value=canary,enable=${{ steps.vars.outputs.branch == 'canary' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.vars.outputs.custom_tag }}

  helm-chart:
    name: Publish Helm Chart
    # 与 Docker 构建并行执行，仅在手动触发时发布
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'canary' }}

      - name: Get metadata
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update Chart.yaml with build info
        run: |
          BRANCH="${{ steps.vars.outputs.branch }}"
          SHA="${{ steps.vars.outputs.sha_short }}"
          # 读取基础版本号
          BASE_VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          # 生成带 SHA 的版本号：0.1.0-canary.abc1234
          CHART_VERSION="${BASE_VERSION}-${BRANCH}.${SHA}"
          # 更新 Chart.yaml
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${BRANCH}-${SHA}\"/" helm/Chart.yaml
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          cat helm/Chart.yaml

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package Helm Chart
        run: |
          helm package helm/ --destination /tmp/helm-pkg

      - name: Push Helm Chart to GHCR
        run: |
          CHART_PKG=$(ls /tmp/helm-pkg/*.tgz)
          helm push "${CHART_PKG}" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
